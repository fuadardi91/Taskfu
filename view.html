<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Fufu - View Only</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-[#27272a]">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                    ⚡ Task Fufu 
                    <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-normal border border-blue-500/30">View Only Mode</span>
                    <span id="sync-status" class="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 font-normal border border-amber-500/30">Connecting...</span>
                </h1>
                <p class="text-sm text-zinc-400 mt-1 italic">"Kerjain Deadline jangan sampai Dead"</p>
            </div>
        </header>

        <!-- View Switcher & Filter -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6 bg-[#121216] p-3 rounded-2xl border border-[#27272a]">
            <div class="flex bg-zinc-900 p-1 rounded-xl border border-[#27272a]">
                <button onclick="switchView('list')" id="btn-list" class="px-4 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer">📋 List View</button>
                <button onclick="switchView('calendar')" id="btn-calendar" class="px-4 py-1.5 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white cursor-pointer">📅 Calendar View</button>
            </div>

            <div id="filter-container" class="flex items-center gap-2">
                <input type="text" id="search-input" oninput="renderTasks()" placeholder="Cari task..." class="bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 w-full sm:w-48">
                <select id="category-filter" onchange="renderTasks()" class="bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
                    <option value="">Semua Kategori</option>
                    <option value="Desain">Desain</option>
                    <option value="Fastwork">Fastwork</option>
                    <option value="Bumper">Bumper</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Event">Event</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
        </div>

        <!-- LIST VIEW CONTAINER -->
        <div id="list-view-container">
            <!-- Status Tabs -->
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="status-tabs">
                <button onclick="filterStatus('all')" class="tab-btn px-4 py-1.5 rounded-xl border border-zinc-600 bg-zinc-800 text-white text-sm font-medium cursor-pointer">Semua</button>
                <button onclick="filterStatus('To Do')" class="tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer">To Do</button>
                <button onclick="filterStatus('In Progress')" class="tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer">In Progress</button>
                <button onclick="filterStatus('Completed')" class="tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer">Completed</button>
            </div>

            <!-- Task List Render Target -->
            <div id="task-list" class="space-y-3"></div>
        </div>

        <!-- CALENDAR VIEW CONTAINER -->
        <div id="calendar-view-container" class="hidden bg-[#121216] border border-[#27272a] rounded-2xl p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 id="calendar-month-year" class="text-lg font-bold text-white"></h2>
                <div class="flex items-center gap-2">
                    <button onclick="changeMonth(-1)" class="p-2 bg-zinc-900 border border-[#27272a] rounded-xl text-zinc-300 cursor-pointer">◀</button>
                    <button onclick="resetToCurrentMonth()" class="px-3 py-1.5 bg-zinc-900 border border-[#27272a] rounded-xl text-xs font-medium text-zinc-300 cursor-pointer">Hari Ini</button>
                    <button onclick="changeMonth(1)" class="p-2 bg-zinc-900 border border-[#27272a] rounded-xl text-zinc-300 cursor-pointer">▶</button>
                </div>
            </div>
            
            <!-- Legend Priority Color -->
            <div class="flex items-center gap-4 mb-4 text-xs text-zinc-400 bg-zinc-900/50 p-2.5 rounded-xl border border-[#27272a]">
                <span class="font-medium text-zinc-300">Prioritas:</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> High</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Medium</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> Low</span>
            </div>

            <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-semibold text-zinc-500">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
            
            <div class="mt-6 pt-6 border-t border-[#27272a]" id="calendar-details-section">
                <h3 class="text-sm font-semibold text-zinc-300 mb-3">Task Deadline tanggal: <span id="selected-date-text" class="text-indigo-400"></span></h3>
                <div id="calendar-date-tasks" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- SUPABASE JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wnrlyvvgwpfytjjlnoke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qDIhgn7HsMp7TuaqvuA7BA_RhivTTQ4';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tasks = [];
        let currentFilterStatus = 'all';
        let currentViewMode = 'list';
        let viewMonth = new Date().getMonth();
        let viewYear = new Date().getFullYear();
        let selectedDateStr = new Date().toISOString().split('T')[0];

        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        async function fetchTasks() {
            const statusEl = document.getElementById('sync-status');
            try {
                const { data, error } = await _supabase.from('tasks').select('*');
                if (error) throw error;
                
                tasks = data || [];
                tasks.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
                
                statusEl.textContent = "Synced Live";
                statusEl.className = "text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-normal border border-emerald-500/30";
                
                renderTasks();
                renderCalendar();
            } catch (err) {
                console.error("Supabase error:", err);
                statusEl.textContent = "Connection Error";
                statusEl.className = "text-xs px-2.5 py-0.5 rounded-full bg-red-500/20 text-red-400 font-normal border border-red-500/30";
            }
        }

        function switchView(mode) {
            currentViewMode = mode;
            const listView = document.getElementById('list-view-container');
            const calView = document.getElementById('calendar-view-container');
            const btnList = document.getElementById('btn-list');
            const btnCal = document.getElementById('btn-calendar');
            const filterContainer = document.getElementById('filter-container');

            if (mode === 'list') {
                listView.classList.remove('hidden');
                calView.classList.add('hidden');
                filterContainer.classList.remove('hidden');
                btnList.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer";
                btnCal.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white cursor-pointer";
                renderTasks();
            } else {
                listView.classList.add('hidden');
                calView.classList.remove('hidden');
                filterContainer.classList.add('hidden');
                btnCal.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer";
                btnList.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white cursor-pointer";
                renderCalendar();
            }
        }

        function filterStatus(status) {
            currentFilterStatus = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer";
                if(btn.textContent.includes(status) || (status === 'all' && btn.textContent === 'Semua')) {
                    btn.className = "tab-btn px-4 py-1.5 rounded-xl border border-zinc-600 bg-zinc-800 text-white text-sm font-medium cursor-pointer";
                }
            });
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const catFilter = document.getElementById('category-filter').value;

            const filtered = tasks.filter(t => {
                const matchStatus = currentFilterStatus === 'all' || t.status === currentFilterStatus;
                const matchCat = !catFilter || t.category === catFilter;
                const matchSearch = t.title.toLowerCase().includes(searchQuery);
                return matchStatus && matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-16 bg-[#121216] border border-[#27272a] rounded-2xl text-zinc-500 text-sm">Belum ada task yang sesuai.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div class="bg-[#121216]/40 hover:bg-[#121216]/80 border border-[#27272a] rounded-2xl p-4 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-start gap-3">
                        <!-- Indikator ikon status saja (tidak bisa diklik/diubah) -->
                        <div class="mt-1 w-5 h-5 rounded-lg border flex items-center justify-center text-xs ${t.status === 'Completed' ? 'bg-emerald-500 border-emerald-500 text-black font-bold' : 'border-zinc-700 text-zinc-500'}">
                            ${t.status === 'Completed' ? '✓' : ''}
                        </div>
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="font-semibold text-white text-base ${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</h3>
                                <span class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-zinc-800 text-zinc-300 border border-zinc-700">${t.category}</span>
                                <span class="text-xs px-2 py-0.5 rounded font-bold ${t.priority === 'High' ? 'bg-red-500/10 text-red-400' : t.priority === 'Medium' ? 'bg-amber-500/10 text-amber-400' : 'bg-indigo-500/10 text-indigo-400'}">${t.priority}</span>
                            </div>
                            <p class="text-xs text-zinc-400 mt-1">${t.notes || 'Tidak ada catatan'}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-3 border-t sm:border-t-0 pt-3 sm:pt-0 border-[#27272a]">
                        <div class="text-right">
                            <span class="text-xs font-medium block text-zinc-400">${t.deadline}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full mt-1 inline-block bg-zinc-900 border border-[#27272a] text-zinc-300">${t.status}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function changeMonth(dir) {
            viewMonth += dir;
            if(viewMonth > 11) { viewMonth = 0; viewYear++; }
            if(viewMonth < 0) { viewMonth = 11; viewYear--; }
            renderCalendar();
        }

        function resetToCurrentMonth() {
            viewMonth = new Date().getMonth();
            viewYear = new Date().getFullYear();
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-year').textContent = `${monthNames[viewMonth]} ${viewYear}`;
            const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
            const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            
            let html = '';
            for(let i=0; i<firstDayIndex; i++) {
                html += `<div class="min-h-[95px] p-2 rounded-xl border border-zinc-900 bg-zinc-900/20"></div>`;
            }

            for(let i=1; i<=totalDays; i++) {
                const dStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayTasks = tasks.filter(t => t.deadline === dStr);
                const isSelected = selectedDateStr === dStr ? 'border-indigo-500 bg-indigo-600/10' : 'border-[#27272a] bg-zinc-900';

                html += `
                    <div onclick="selectDate('${dStr}')" class="min-h-[95px] p-2 rounded-xl border ${isSelected} cursor-pointer flex flex-col justify-between transition hover:border-indigo-500">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium text-zinc-300">${i}</span>
                            ${dayTasks.length > 0 ? `<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-zinc-800 text-zinc-400 font-bold">${dayTasks.length}</span>` : ''}
                        </div>
                        <div class="space-y-1">
                            ${dayTasks.slice(0,2).map(t => {
                                let dotColor = 'bg-indigo-500';
                                if(t.priority === 'High') dotColor = 'bg-red-500';
                                if(t.priority === 'Medium') dotColor = 'bg-amber-500';
                                return `<div class="text-[10px] truncate px-1.5 py-0.5 rounded bg-zinc-800/90 text-zinc-200 flex items-center gap-1.5 border-l-2 ${t.priority === 'High' ? 'border-red-500' : t.priority === 'Medium' ? 'border-amber-500' : 'border-indigo-500'}">
                                    <span class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0"></span>
                                    <span class="${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = html;
            renderCalendarDetails();
        }

        function selectDate(dStr) {
            selectedDateStr = dStr;
            renderCalendar();
        }

        function renderCalendarDetails() {
            document.getElementById('selected-date-text').textContent = selectedDateStr;
            const container = document.getElementById('calendar-date-tasks');
            const matched = tasks.filter(t => t.deadline === selectedDateStr);

            if(matched.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-500 italic">Tidak ada deadline task di tanggal ini.</div>`;
                return;
            }

            container.innerHTML = matched.map(t => `
                <div class="bg-zinc-900 border border-[#27272a] rounded-xl p-3 flex items-center justify-between">
                    <div>
                        <h4 class="text-sm font-medium text-white ${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</h4>
                        <p class="text-xs text-zinc-400">${t.category} • <span class="${t.priority === 'High' ? 'text-red-400 font-semibold' : 'text-zinc-300'}">${t.priority}</span></p>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">${t.status}</span>
                </div>
            `).join('');
        }

        // Auto Refresh data dari Supabase setiap 10 detik agar selalu sinkron secara live
        fetchTasks();
        setInterval(fetchTasks, 10000);
    </script>
</body>
</html>
