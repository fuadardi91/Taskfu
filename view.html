<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Fufu - Mobile View</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen p-3 md:p-6">

    <div class="max-w-xl mx-auto">
        <!-- Header Ringkas untuk HP -->
        <header class="flex items-center justify-between mb-4 pb-3 border-b border-[#27272a]">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-1.5">
                    ⚡ Task Fufu 
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">Mobile View</span>
                </h1>
            </div>
            <span id="sync-status" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Connecting...</span>
        </header>

        <!-- View Switcher & Filter Minimalis -->
        <div class="flex flex-col gap-2.5 mb-4 bg-[#121216] p-2.5 rounded-xl border border-[#27272a]">
            <!-- Mode Toggle -->
            <div class="flex bg-zinc-900 p-1 rounded-lg border border-[#27272a]">
                <button onclick="switchView('list')" id="btn-list" class="flex-1 py-1 rounded-md text-xs font-medium transition bg-indigo-600 text-white">📋 List</button>
                <button onclick="switchView('calendar')" id="btn-calendar" class="flex-1 py-1 rounded-md text-xs font-medium transition text-zinc-400 hover:text-white">📅 Kalender</button>
            </div>

            <!-- Search & Filter Kategori -->
            <div class="flex items-center gap-2">
                <input type="text" id="search-input" oninput="renderTasks()" placeholder="Cari task..." class="bg-zinc-900 border border-[#27272a] text-xs rounded-lg px-2.5 py-1.5 text-zinc-200 focus:outline-none focus:border-indigo-500 flex-1">
                <select id="category-filter" onchange="renderTasks()" class="bg-zinc-900 border border-[#27272a] text-xs rounded-lg px-2 py-1.5 text-zinc-200 focus:outline-none">
                    <option value="">Semua Kategori</option>
                    <option value="Desain">Desain</option>
                    <option value="Fastwork">Fastwork</option>
                    <option value="Bumper">Bumper</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Event">Event</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
        </div>

        <!-- LIST VIEW CONTAINER -->
        <div id="list-view-container">
            <!-- Status Tabs (Default ke To Do) -->
            <div class="flex gap-1.5 mb-4 overflow-x-auto pb-1" id="status-tabs">
                <button onclick="filterStatus('To Do')" class="tab-btn px-3 py-1 rounded-lg border border-zinc-600 bg-zinc-800 text-white text-xs font-medium whitespace-nowrap">To Do</button>
                <button onclick="filterStatus('In Progress')" class="tab-btn px-3 py-1 rounded-lg border border-[#27272a] text-zinc-400 text-xs font-medium whitespace-nowrap">In Progress</button>
                <button onclick="filterStatus('Completed')" class="tab-btn px-3 py-1 rounded-lg border border-[#27272a] text-zinc-400 text-xs font-medium whitespace-nowrap">Completed</button>
                <button onclick="filterStatus('all')" class="tab-btn px-3 py-1 rounded-lg border border-[#27272a] text-zinc-400 text-xs font-medium whitespace-nowrap">Semua</button>
            </div>

            <!-- Task List Render Target -->
            <div id="task-list" class="space-y-2"></div>
        </div>

        <!-- CALENDAR VIEW CONTAINER -->
        <div id="calendar-view-container" class="hidden bg-[#121216] border border-[#27272a] rounded-xl p-3">
            <div class="flex items-center justify-between mb-3">
                <h2 id="calendar-month-year" class="text-sm font-bold text-white"></h2>
                <div class="flex items-center gap-1.5">
                    <button onclick="changeMonth(-1)" class="px-2 py-1 bg-zinc-900 border border-[#27272a] rounded-lg text-xs text-zinc-300">◀</button>
                    <button onclick="resetToCurrentMonth()" class="px-2 py-1 bg-zinc-900 border border-[#27272a] rounded-lg text-[10px] font-medium text-zinc-300">Hari Ini</button>
                    <button onclick="changeMonth(1)" class="px-2 py-1 bg-zinc-900 border border-[#27272a] rounded-lg text-xs text-zinc-300">▶</button>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-1 mb-1 text-center text-[10px] font-semibold text-zinc-500">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-1 gap-1"></div>
            
            <div class="mt-4 pt-3 border-t border-[#27272a]" id="calendar-details-section">
                <h3 class="text-xs font-semibold text-zinc-300 mb-2">Deadline tanggal: <span id="selected-date-text" class="text-indigo-400"></span></h3>
                <div id="calendar-date-tasks" class="space-y-1.5"></div>
            </div>
        </div>
    </div>

    <!-- SUPABASE JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://wnrlyvvgwpfytjjlnoke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qDIhgn7HsMp7TuaqvuA7BA_RhivTTQ4';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tasks = [];
        let currentFilterStatus = 'To Do'; // Default awal ke To Do
        let currentViewMode = 'list';
        let viewMonth = new Date().getMonth();
        let viewYear = new Date().getFullYear();
        let selectedDateStr = new Date().toISOString().split('T')[0];

        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        async function fetchTasks() {
            const statusEl = document.getElementById('sync-status');
            try {
                const { data, error } = await _supabase.from('tasks').select('*');
                if (error) throw error;
                
                tasks = data || [];
                tasks.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
                
                statusEl.textContent = "Live";
                statusEl.className = "text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                
                renderTasks();
                renderCalendar();
            } catch (err) {
                console.error("Supabase error:", err);
                statusEl.textContent = "Error";
                statusEl.className = "text-[10px] px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/30";
            }
        }

        function switchView(mode) {
            currentViewMode = mode;
            const listView = document.getElementById('list-view-container');
            const calView = document.getElementById('calendar-view-container');
            const btnList = document.getElementById('btn-list');
            const btnCal = document.getElementById('btn-calendar');

            if (mode === 'list') {
                listView.classList.remove('hidden');
                calView.classList.add('hidden');
                btnList.className = "flex-1 py-1 rounded-md text-xs font-medium transition bg-indigo-600 text-white";
                btnCal.className = "flex-1 py-1 rounded-md text-xs font-medium transition text-zinc-400 hover:text-white";
                renderTasks();
            } else {
                listView.classList.add('hidden');
                calView.classList.remove('hidden');
                btnCal.className = "flex-1 py-1 rounded-md text-xs font-medium transition bg-indigo-600 text-white";
                btnList.className = "flex-1 py-1 rounded-md text-xs font-medium transition text-zinc-400 hover:text-white";
                renderCalendar();
            }
        }

        function filterStatus(status) {
            currentFilterStatus = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-3 py-1 rounded-lg border border-[#27272a] text-zinc-400 text-xs font-medium whitespace-nowrap";
                if(btn.textContent.toLowerCase() === status.toLowerCase() || (status === 'all' && btn.textContent === 'Semua')) {
                    btn.className = "tab-btn px-3 py-1 rounded-lg border border-zinc-600 bg-zinc-800 text-white text-xs font-medium whitespace-nowrap";
                }
            });
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const catFilter = document.getElementById('category-filter').value;

            const filtered = tasks.filter(t => {
                const matchStatus = currentFilterStatus === 'all' || t.status === currentFilterStatus;
                const matchCat = !catFilter || t.category === catFilter;
                const matchSearch = t.title.toLowerCase().includes(searchQuery);
                return matchStatus && matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 bg-[#121216] border border-[#27272a] rounded-xl text-zinc-500 text-xs">Belum ada task.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div class="bg-[#121216] border border-[#27272a] rounded-xl p-3 flex flex-col gap-2">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-start gap-2">
                            <div class="mt-0.5 w-4 h-4 rounded border flex items-center justify-center text-[10px] ${t.status === 'Completed' ? 'bg-emerald-500 border-emerald-500 text-black font-bold' : 'border-zinc-700 text-zinc-500'}">
                                ${t.status === 'Completed' ? '✓' : ''}
                            </div>
                            <div>
                                <h3 class="font-medium text-white text-xs ${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</h3>
                                <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                                    <span class="text-[10px] px-2 py-0.2 rounded-full font-medium bg-zinc-900 text-zinc-300 border border-zinc-800">${t.category}</span>
                                    <span class="text-[10px] px-1.5 py-0.2 rounded font-bold ${t.priority === 'High' ? 'bg-red-500/10 text-red-400' : t.priority === 'Medium' ? 'bg-amber-500/10 text-amber-400' : 'bg-indigo-500/10 text-indigo-400'}">${t.priority}</span>
                                </div>
                            </div>
                        </div>
                        <span class="text-[10px] font-medium text-zinc-400 whitespace-nowrap">${t.deadline}</span>
                    </div>
                    ${t.notes ? `<p class="text-[11px] text-zinc-400 bg-zinc-900/60 p-2 rounded-lg border border-zinc-800/60">${t.notes}</p>` : ''}
                </div>
            `).join('');
        }

        function changeMonth(dir) {
            viewMonth += dir;
            if(viewMonth > 11) { viewMonth = 0; viewYear++; }
            if(viewMonth < 0) { viewMonth = 11; viewYear--; }
            renderCalendar();
        }

        function resetToCurrentMonth() {
            viewMonth = new Date().getMonth();
            viewYear = new Date().getFullYear();
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-year').textContent = `${monthNames[viewMonth]} ${viewYear}`;
            const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
            const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            
            let html = '';
            for(let i=0; i<firstDayIndex; i++) {
                html += `<div class="min-h-[60px] p-1.5 rounded-lg border border-zinc-900 bg-zinc-900/10"></div>`;
            }

            for(let i=1; i<=totalDays; i++) {
                const dStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayTasks = tasks.filter(t => t.deadline === dStr);
                const isSelected = selectedDateStr === dStr ? 'border-indigo-500 bg-indigo-600/10' : 'border-[#27272a] bg-zinc-900';

                html += `
                    <div onclick="selectDate('${dStr}')" class="min-h-[60px] p-1.5 rounded-lg border ${isSelected} cursor-pointer flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-medium text-zinc-300">${i}</span>
                            ${dayTasks.length > 0 ? `<span class="text-[9px] px-1 rounded bg-zinc-800 text-zinc-400 font-bold">${dayTasks.length}</span>` : ''}
                        </div>
                        <div class="space-y-0.5">
                            ${dayTasks.slice(0,2).map(t => {
                                let dotColor = 'bg-indigo-500';
                                if(t.priority === 'High') dotColor = 'bg-red-500';
                                if(t.priority === 'Medium') dotColor = 'bg-amber-500';
                                return `<div class="text-[9px] truncate px-1 py-0.5 rounded bg-zinc-800/80 text-zinc-200 flex items-center gap-1 border-l-2 ${t.priority === 'High' ? 'border-red-500' : t.priority === 'Medium' ? 'border-amber-500' : 'border-indigo-500'}">
                                    <span class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0"></span>
                                    <span class="${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            grid.className = "grid grid-cols-7 gap-1";
            grid.innerHTML = html;
            renderCalendarDetails();
        }

        function selectDate(dStr) {
            selectedDateStr = dStr;
            renderCalendar();
        }

        function renderCalendarDetails() {
            document.getElementById('selected-date-text').textContent = selectedDateStr;
            const container = document.getElementById('calendar-date-tasks');
            const matched = tasks.filter(t => t.deadline === selectedDateStr);

            if(matched.length === 0) {
                container.innerHTML = `<div class="text-[11px] text-zinc-500 italic">Tidak ada deadline di tanggal ini.</div>`;
                return;
            }

            container.innerHTML = matched.map(t => `
                <div class="bg-zinc-900 border border-[#27272a] rounded-lg p-2 flex items-center justify-between text-xs">
                    <div>
                        <h4 class="font-medium text-white ${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</h4>
                        <p class="text-[10px] text-zinc-400">${t.category} • <span class="${t.priority === 'High' ? 'text-red-400 font-semibold' : 'text-zinc-300'}">${t.priority}</span></p>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300">${t.status}</span>
                </div>
            `).join('');
        }

        fetchTasks();
        setInterval(fetchTasks, 10000);
    </script>
</body>
</html>
