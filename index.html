<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Fufu - Kerjain Deadline jangan sampai Dead</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-6 border-b border-[#27272a]">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                    ⚡ Task Fufu 
                    <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 font-normal border border-indigo-500/30">Pure JS (Anti-Stuck)</span>
                </h1>
                <p class="text-sm text-zinc-400 mt-1 italic">"Kerjain Deadline jangan sampai Dead"</p>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center gap-2 text-sm cursor-pointer">
                + Tambah Task Baru
            </button>
        </header>

        <!-- View Switcher & Filter -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6 bg-[#121216] p-3 rounded-2xl border border-[#27272a]">
            <div class="flex bg-zinc-900 p-1 rounded-xl border border-[#27272a]">
                <button onclick="switchView('list')" id="btn-list" class="px-4 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer">📋 List View</button>
                <button onclick="switchView('calendar')" id="btn-calendar" class="px-4 py-1.5 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white cursor-pointer">📅 Calendar View</button>
            </div>

            <div id="filter-container" class="flex items-center gap-2">
                <input type="text" id="search-input" oninput="renderTasks()" placeholder="Cari task..." class="bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500 w-full sm:w-48">
                <select id="category-filter" onchange="renderTasks()" class="bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
                    <option value="">Semua Kategori</option>
                    <option value="Desain">Desain</option>
                    <option value="Fastwork">Fastwork</option>
                    <option value="Admin">Admin</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>
        </div>

        <!-- LIST VIEW CONTAINER -->
        <div id="list-view-container">
            <!-- Status Tabs -->
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="status-tabs">
                <button onclick="filterStatus('all')" class="tab-btn px-4 py-1.5 rounded-xl border border-zinc-600 bg-zinc-800 text-white text-sm font-medium cursor-pointer">Semua</button>
                <button onclick="filterStatus('To Do')" class="tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer">To Do</button>
                <button onclick="filterStatus('In Progress')" class="tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer">In Progress</button>
                <button onclick="filterStatus('Completed')" class="tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer">Completed</button>
            </div>

            <!-- Task List Render Target -->
            <div id="task-list" class="space-y-3"></div>
        </div>

        <!-- CALENDAR VIEW CONTAINER -->
        <div id="calendar-view-container" class="hidden bg-[#121216] border border-[#27272a] rounded-2xl p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 id="calendar-month-year" class="text-lg font-bold text-white"></h2>
                <div class="flex items-center gap-2">
                    <button onclick="changeMonth(-1)" class="p-2 bg-zinc-900 border border-[#27272a] rounded-xl text-zinc-300 cursor-pointer">◀</button>
                    <button onclick="resetToCurrentMonth()" class="px-3 py-1.5 bg-zinc-900 border border-[#27272a] rounded-xl text-xs font-medium text-zinc-300 cursor-pointer">Hari Ini</button>
                    <button onclick="changeMonth(1)" class="p-2 bg-zinc-900 border border-[#27272a] rounded-xl text-zinc-300 cursor-pointer">▶</button>
                </div>
            </div>
            <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-semibold text-zinc-500">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
            
            <div class="mt-6 pt-6 border-t border-[#27272a]" id="calendar-details-section">
                <h3 class="text-sm font-semibold text-zinc-300 mb-3">Task Deadline tanggal: <span id="selected-date-text" class="text-indigo-400"></span></h3>
                <div id="calendar-date-tasks" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 hidden">
        <div class="bg-[#121216] border border-[#27272a] rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <h2 id="modal-title" class="text-lg font-bold text-white mb-4">Tambah Task Baru</h2>
            <form onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1">Judul Pekerjaan</label>
                    <input type="text" id="form-title" required placeholder="Contoh: Bikin Banner Fastwork..." class="w-full bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Kategori</label>
                        <select id="form-category" class="w-full bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none">
                            <option value="Desain">Desain</option>
                            <option value="Fastwork">Fastwork</option>
                            <option value="Admin">Admin</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Prioritas</label>
                        <select id="form-priority" class="w-full bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Tanggal Deadline</label>
                        <input type="date" id="form-deadline" required class="w-full bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Status</label>
                        <select id="form-status" class="w-full bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none">
                            <option value="To Do">To Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1">Catatan Tambahan</label>
                    <textarea id="form-notes" rows="2" placeholder="Link file, revisi, dll..." class="w-full bg-zinc-900 border border-[#27272a] text-sm rounded-xl px-3 py-2 text-zinc-200 focus:outline-none"></textarea>
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm font-medium rounded-xl cursor-pointer">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl cursor-pointer">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PURE JAVASCRIPT LOGIC (DIJAMIN ANTI-STUCK) -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('task_fufu_data')) || [
            { id: 1, title: 'Bikin Banner Event M.I.C.E 2027', category: 'Desain', deadline: new Date().toISOString().split('T')[0], priority: 'High', status: 'In Progress', notes: 'Revisi warna dari klien' }
        ];

        let currentFilterStatus = 'all';
        let currentViewMode = 'list';
        let viewMonth = new Date().getMonth();
        let viewYear = new Date().getFullYear();
        let selectedDateStr = new Date().toISOString().split('T')[0];

        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        function saveData() {
            localStorage.setItem('task_fufu_data', JSON.stringify(tasks));
            renderTasks();
            renderCalendar();
        }

        function switchView(mode) {
            currentViewMode = mode;
            const listView = document.getElementById('list-view-container');
            const calView = document.getElementById('calendar-view-container');
            const btnList = document.getElementById('btn-list');
            const btnCal = document.getElementById('btn-calendar');
            const filterContainer = document.getElementById('filter-container');

            if (mode === 'list') {
                listView.classList.remove('hidden');
                calView.classList.add('hidden');
                filterContainer.classList.remove('hidden');
                btnList.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer";
                btnCal.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white cursor-pointer";
                renderTasks();
            } else {
                listView.classList.add('hidden');
                calView.classList.remove('hidden');
                filterContainer.classList.add('hidden');
                btnCal.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white cursor-pointer";
                btnList.className = "px-4 py-1.5 rounded-lg text-sm font-medium transition text-zinc-400 hover:text-white cursor-pointer";
                renderCalendar();
            }
        }

        function filterStatus(status) {
            currentFilterStatus = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-1.5 rounded-xl border border-[#27272a] text-zinc-400 text-sm font-medium cursor-pointer";
                if(btn.textContent.includes(status) || (status === 'all' && btn.textContent === 'Semua')) {
                    btn.className = "tab-btn px-4 py-1.5 rounded-xl border border-zinc-600 bg-zinc-800 text-white text-sm font-medium cursor-pointer";
                }
            });
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const catFilter = document.getElementById('category-filter').value;

            const filtered = tasks.filter(t => {
                const matchStatus = currentFilterStatus === 'all' || t.status === currentFilterStatus;
                const matchCat = !catFilter || t.category === catFilter;
                const matchSearch = t.title.toLowerCase().includes(searchQuery);
                return matchStatus && matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-16 bg-[#121216] border border-[#27272a] rounded-2xl text-zinc-500 text-sm">Belum ada task yang sesuai.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div class="bg-[#121216]/40 hover:bg-[#121216]/80 border border-[#27272a] rounded-2xl p-4 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-start gap-3">
                        <button onclick="toggleStatus(${t.id})" class="mt-1 w-5 h-5 rounded-lg border flex items-center justify-center transition cursor-pointer ${t.status === 'Completed' ? 'bg-emerald-500 border-emerald-500 text-black' : 'border-zinc-600'}">
                            ${t.status === 'Completed' ? '✓' : ''}
                        </button>
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="font-semibold text-white text-base ${t.status === 'Completed' ? 'line-through text-zinc-500' : ''}">${t.title}</h3>
                                <span class="text-xs px-2.5 py-0.5 rounded-full font-medium bg-zinc-800 text-zinc-300 border border-zinc-700">${t.category}</span>
                                <span class="text-xs px-2 py-0.5 rounded font-bold ${t.priority === 'High' ? 'bg-red-500/10 text-red-400' : 'bg-amber-500/10 text-amber-400'}">${t.priority}</span>
                            </div>
                            <p class="text-xs text-zinc-400 mt-1">${t.notes || 'Tidak ada catatan'}</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-4 border-t sm:border-t-0 pt-3 sm:pt-0 border-[#27272a]">
                        <div class="text-right">
                            <span class="text-xs font-medium block text-zinc-400">${t.deadline}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full mt-0.5 inline-block bg-zinc-800 text-zinc-300">${t.status}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick='editTask(${JSON.stringify(t)})' class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg cursor-pointer">✏️</button>
                            <button onclick="deleteTask(${t.id})" class="p-2 text-zinc-400 hover:text-red-400 hover:bg-zinc-800 rounded-lg cursor-pointer">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal() {
            document.getElementById('modal-title').textContent = "Tambah Task Baru";
            document.getElementById('task-id').value = "";
            document.getElementById('form-title').value = "";
            document.getElementById('form-notes').value = "";
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function editTask(t) {
            document.getElementById('modal-title').textContent = "Edit Task";
            document.getElementById('task-id').value = t.id;
            document.getElementById('form-title').value = t.title;
            document.getElementById('form-category').value = t.category;
            document.getElementById('form-priority').value = t.priority;
            document.getElementById('form-deadline').value = t.deadline;
            document.getElementById('form-status').value = t.status;
            document.getElementById('form-notes').value = t.notes || '';
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('form-title').value;
            const category = document.getElementById('form-category').value;
            const priority = document.getElementById('form-priority').value;
            const deadline = document.getElementById('form-deadline').value;
            const status = document.getElementById('form-status').value;
            const notes = document.getElementById('form-notes').value;

            if (id) {
                tasks = tasks.map(t => t.id == id ? { ...t, title, category, priority, deadline, status, notes } : t);
            } else {
                tasks.push({ id: Date.now(), title, category, priority, deadline, status, notes });
            }

            saveData();
            closeModal();
        }

        function deleteTask(id) {
            if(confirm('Yakin ingin menghapus task ini?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveData();
            }
        }

        function toggleStatus(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, status: t.status === 'Completed' ? 'To Do' : 'Completed' } : t);
            saveData();
        }

        // Calendar Logic
        function changeMonth(dir) {
            viewMonth += dir;
            if(viewMonth > 11) { viewMonth = 0; viewYear++; }
            if(viewMonth < 0) { viewMonth = 11; viewYear--; }
            renderCalendar();
        }

        function resetToCurrentMonth() {
            viewMonth = new Date().getMonth();
            viewYear = new Date().getFullYear();
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-year').textContent = `${monthNames[viewMonth]} ${viewYear}`;
            const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
            const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            
            let html = '';
            for(let i=0; i<firstDayIndex; i++) {
                html += `<div class="min-h-[85px] p-2 rounded-xl border border-zinc-900 bg-zinc-900/20"></div>`;
            }

            for(let i=1; i<=totalDays; i++) {
                const dStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayTasks = tasks.filter(t => t.deadline === dStr);
                const isSelected = selectedDateStr === dStr ? 'border-indigo-500 bg-indigo-600/10' : 'border-[#27272a] bg-zinc-900';

                html += `
                    <div onclick="selectDate('${dStr}')" class="min-h-[85px] p-2 rounded-xl border ${isSelected} cursor-pointer flex flex-col justify-between transition hover:border-indigo-500">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-medium text-zinc-300">${i}</span>
                            ${dayTasks.length > 0 ? '<span class="w-2 h-2 rounded-full bg-indigo-500"></span>' : ''}
                        </div>
                        <div class="space-y-1">
                            ${dayTasks.slice(0,2).map(t => `<div class="text-[10px] truncate px-1 py-0.5 rounded bg-zinc-800 text-zinc-300">${t.title}</div>`).join('')}
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = html;
            renderCalendarDetails();
        }

        function selectDate(dStr) {
            selectedDateStr = dStr;
            renderCalendar();
        }

        function renderCalendarDetails() {
            document.getElementById('selected-date-text').textContent = selectedDateStr;
            const container = document.getElementById('calendar-date-tasks');
            const matched = tasks.filter(t => t.deadline === selectedDateStr);

            if(matched.length === 0) {
                container.innerHTML = `<div class="text-xs text-zinc-500 italic">Tidak ada deadline task di tanggal ini.</div>`;
                return;
            }

            container.innerHTML = matched.map(t => `
                <div class="bg-zinc-900 border border-[#27272a] rounded-xl p-3 flex items-center justify-between">
                    <div>
                        <h4 class="text-sm font-medium text-white">${t.title}</h4>
                        <p class="text-xs text-zinc-400">${t.category} • ${t.priority}</p>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">${t.status}</span>
                </div>
            `).join('');
        }

        // Init First Load
        renderTasks();
    </script>
</body>
</html>
